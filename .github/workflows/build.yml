name: Build MirageTreesExt

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Two Syringe hook defects that build and link perfectly and only show up
      # in game, as a crash with no module to blame:
      #
      #   1. OVERLAP — hooks at DIFFERENT addresses whose byte ranges intersect
      #      corrupt each other's E9 rel32 into a wild jump. Both can be
      #      instruction-aligned, so only a range check finds it.
      #   2. RESUME BOUNDARY — Syringe always writes 5 bytes and always resumes
      #      at addr+max(size,5), so a hook declaring size<5 (or splitting an
      #      instruction) resumes on orphaned bytes. That is what crashed
      #      0x6F7CB1: size 4 resumed onto a stray 0x17 = `pop ss` -> #GP.
      #
      # The full boundary check needs the game executable, which cannot live in
      # CI, so this runs the source-only tier. `tools/check_hook_bounds.py --exe
      # <gamemd-spawn.exe>` runs the complete check locally before deploying.
      - name: Check Syringe hooks
        shell: bash
        run: |
          curl -sSfL -o hooks.csv \
            https://raw.githubusercontent.com/SethGekco/YR-Hook-Encyclopedia/main/registry/hooks.csv
          python3 tools/check_hook_overlap.py hooks.csv src
          python3 tools/check_hook_bounds.py --registry hooks.csv src

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL
        shell: pwsh
        run: |
          $src14 = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.51.36231"
          $dst14 = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133"
          if (Test-Path "$src14\atlmfc\include") {
            Copy-Item "$src14\atlmfc\include\*" "$dst14\include\" -Force
            Copy-Item "$src14\atlmfc\lib\x86\atls.lib" "$dst14\lib\x86\" -Force
            Write-Host "ATL headers and atls.lib copied"
          } else {
            Write-Host "ATL source not found at expected path, trying alternatives..."
            $vsWhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vsWhere -latest -property installationPath
            $atlPath = Get-ChildItem "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
            Write-Host "Found MSVC at: $($atlPath.FullName)"
          }

      - name: Build
        run: msbuild MirageTreesExt.sln /p:Configuration=DevBuild /p:Platform=x86

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirageTreesExt
          path: |
            DevBuild\MirageTreesExt.dll
            DevBuild\MirageTreesExt.map
